<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Človek, ne jezi se!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3efe7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#202020;touch-action:manipulation}
body{padding:max(8px,env(safe-area-inset-top)) 8px max(12px,env(safe-area-inset-bottom))}
.app{width:min(100%,520px);margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}h1{font-size:21px;margin:0}.sub{font-size:11px;color:#777}button{border:0;border-radius:12px;min-height:44px;padding:0 15px;background:#222;color:#fff;font-weight:800;font-size:15px}
.board{position:relative;width:100%;aspect-ratio:1;background:#f9f6ef;border:3px solid #262626;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #0002}.grid{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.cell{display:grid;place-items:center}.field{width:76%;height:76%;border:1px solid #999;border-radius:50%;background:#fff;box-shadow:inset 0 1px 2px #0001}.field.red{background:#f6c1bb;border-color:#d84a40}.field.blue{background:#b9dcef;border-color:#3286b9}.field.green{background:#b8e1c7;border-color:#299054}.field.start{box-shadow:inset 0 0 0 2px #fff,0 0 0 1px #333}.field.lane.red{background:#f0aaa2}.field.lane.blue{background:#9bcde9}.field.lane.green{background:#98d3af}
.home{position:absolute;width:26%;height:26%;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px;border-radius:18px;z-index:3}.home.red{left:3.8%;top:3.8%;background:#e88a80}.home.blue{right:3.8%;top:3.8%;background:#6fb3dc}.home.green{left:3.8%;bottom:3.8%;background:#67bc88}.slot{background:#fff;border:2px solid #fff;border-radius:50%;box-shadow:inset 0 1px 3px #0002}
.center{position:absolute;left:42%;top:42%;width:16%;height:16%;z-index:4;transform:rotate(45deg);background:conic-gradient(#e74c3c 0 33.3%,#3498db 33.3% 66.6%,#2ecc71 66.6%);border:2px solid #333;display:grid;place-items:center}.center span{transform:rotate(-45deg);font-size:20px}
.piece{position:absolute;width:7%;height:7%;border-radius:50%;border:2px solid white;box-shadow:0 3px 6px #0006;z-index:10;color:white;display:grid;place-items:center;font-size:10px;font-weight:900;transition:left .22s linear,top .22s linear}.piece.red{background:#e74c3c}.piece.blue{background:#3498db}.piece.green{background:#2ecc71}.piece.select{outline:3px solid #111;outline-offset:2px}
.panel{margin-top:8px;background:#fff;border-radius:13px;padding:8px;display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;box-shadow:0 2px 10px #0001}.turn{font-size:16px;font-weight:900}.status{font-size:11px;color:#666;margin-top:2px}.dice{width:62px;min-height:54px;background:#fff;color:#222;border:2px solid #ddd;font-size:28px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.score{font-size:11px;font-weight:800;text-align:center;padding:7px;border-radius:9px}.score.red{background:#ffe2df}.score.blue{background:#e3f2fb}.score.green{background:#e1f6e8}
</style>
</head>
<body><main class="app">
<header><div><h1>Človek, ne jezi se!</h1><div class="sub">3 igralci · PWA · offline</div></div><button id="new">Nova</button></header>
<div class="board"><div class="grid" id="grid"></div>
<div class="home red"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div>
<div class="home blue"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div>
<div class="home green"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div>
<div class="center"><span>★</span></div><div id="pieces"></div></div>
<div class="panel"><div><div class="turn" id="turn"></div><div class="status" id="status"></div></div><button class="dice" id="roll">🎲</button></div>
<div class="scores"><div class="score red" id="r"></div><div class="score blue" id="b"></div><div class="score green" id="g"></div></div>
</main>
<script>
const P=[{n:"Rdeči",c:"red",start:0},{n:"Modri",c:"blue",start:13},{n:"Zeleni",c:"green",start:26}];
const path=[];for(let c=5;c<=14;c++)path.push([5,c]);for(let r=6;r<=14;r++)path.push([r,14]);for(let c=13;c>=0;c--)path.push([14,c]);for(let r=13;r>=0;r--)path.push([r,0]);for(let c=1;c<=5;c++)path.push([0,c]);for(let r=1;r<=4;r++)path.push([r,5]);
const lane=[[[5,6],[5,7],[5,8],[5,9],[5,10],[5,11]],[[6,9],[7,9],[8,9],[9,9],[10,9],[11,9]],[[9,8],[9,7],[9,6],[9,5],[9,4],[9,3]]];
let S;
const pct=(r,c)=>({x:(c+.5)/15*100,y:(r+.5)/15*100});
function home(p,i){return pct(...[[[2,2],[4,2],[2,4],[4,4]],[[10,2],[12,2],[10,4],[12,4]],[[2,10],[4,10],[2,12],[4,12]]][p][i].slice().reverse())}
function pos(p,v,i){if(v<0)return home(p,i);if(v<52)return pct(...path[(P[p].start+v)%52].slice().reverse());if(v<58)return pct(...lane[p][v-52].slice().reverse());return pct(7,7)}
function can(p,i){let v=S.x[p][i];return v<0?S.d===6:v+S.d<=58}
function reset(){S={t:0,d:null,w:null,x:P.map(()=>[-1,-1,-1,-1])};draw()}
function board(){let g=document.getElementById("grid");for(let r=0;r<15;r++)for(let c=0;c<15;c++){let e=document.createElement("div");e.className="cell";let f=document.createElement("div");f.className="field";let pi=path.findIndex(q=>q[0]===r&&q[1]===c);if(pi>=0){let o=P.findIndex(p=>p.start===pi);if(o>=0)f.classList.add(P[o].c,"start")}P.forEach((p,pi)=>{if(lane[pi].some(q=>q[0]===r&&q[1]===c))f.classList.add("lane",p.c)});if(r>=6&&r<=8&&c>=6&&c<=8)f.style.visibility="hidden";e.appendChild(f);g.appendChild(e)}} 
function draw(){let z=document.getElementById("pieces");z.innerHTML="";P.forEach((p,pi)=>S.x[pi].forEach((v,i)=>{let e=document.createElement("div");e.className="piece "+p.c+(S.d&&can(pi,i)?" select":"");e.textContent=i+1;let q=pos(pi,v,i);e.style.left=q.x+"%";e.style.top=q.y+"%";e.onclick=()=>move(pi,i);z.appendChild(e)}));turn.textContent=S.w?S.w+" je zmagal!":P[S.t].n+" je na vrsti";status.textContent=S.w?"Pritisni Nova.":S.d?"Kocka: "+S.d+" · tapni označeno figurico.":"Vrzi kocko.";roll.disabled=!!S.d||!!S.w;roll.textContent=S.d?"✓":"🎲";["r","b","g"].forEach((id,i)=>document.getElementById(id).textContent=P[i].n+" · "+S.x[i].filter(v=>v>=58).length+"/4")}
function dice(){if(S.d||S.w)return;S.d=1+Math.floor(Math.random()*6);if(!S.x[S.t].some((_,i)=>can(S.t,i))){S.d=null;S.t=(S.t+1)%3}draw()}
function move(p,i){if(S.w||p!==S.t||!S.d||!can(p,i))return;let v=S.x[p][i];S.x[p][i]=v<0?0:v+S.d;let nv=S.x[p][i];if(nv<52){let sq=(P[p].start+nv)%52;P.forEach((q,o)=>{if(o!==p)S.x[o]=S.x[o].map(v=>v>=0&&v<52&&(q.start+v)%52===sq?-1:v)})}if(S.x[p].every(v=>v>=58)){S.w=P[p].n;S.d=null;draw();return}let again=S.d===6;S.d=null;if(!again)S.t=(S.t+1)%3;draw()}
document.getElementById("roll").onclick=dice;document.getElementById("new").onclick=reset;board();reset();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
